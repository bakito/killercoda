apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      prometheusremotewrite:
        endpoint: "http://prometheus-server.monitoring.svc:80/api/v1/write"
        timeout: 30s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 5000
        retry_on_failure:
          enabled: true
          interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      debug:
        verbosity: detailed
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite, debug]
