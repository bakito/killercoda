server:
  extraFlags:
    - web.enable-remote-write-receiver
  persistentVolume:
    enabled: false
  service:
    type: NodePort
    nodePort: 30090

# No extra scrape configs needed — OTel Collector pushes metrics via remote-write

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false
